version: v2
plugins:
  - remote: buf.build/community/sudorandom-connect-openapi:v0.21.3
    out: web/discopanel/static
    opt:
      - path=schemav1.yaml

  - remote: buf.build/community/sudorandom-connect-openapi:v0.21.3
    out: docs/discopanel/public
    opt:
      - path=schemav1.yaml

  # GORM requires exported fields from API_OPEN.
  - remote: buf.build/protocolbuffers/go:v1.36.12
    out: pkg/proto
    opt:
      - paths=source_relative
      - default_api_level=API_OPEN

  - remote: buf.build/connectrpc/go:v1.19.1
    out: pkg/proto
    opt:
      - paths=source_relative

  - remote: buf.build/bufbuild/es:v2.14.0
    out: web/discopanel/src/lib/proto
    opt:
      - target=ts
      - import_extension=none
    include_imports: true
