name: DiscoPanel Releaser

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Dev version to build, vX.Y.Z-dev or vX.Y.Z-dev.N, image only'
        required: true
        default: 'v3.0.0-dev'

jobs:
  classify:
    name: Classify Tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.parse.outputs.version }}
      stable: ${{ steps.parse.outputs.stable }}
      dev: ${{ steps.parse.outputs.dev }}
    steps:
      - name: Parse release tag
        id: parse
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          TAG="${INPUT_VERSION:-$GITHUB_REF_NAME}"
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+(\.[0-9A-Za-z]+)*)?$ ]]; then
            echo "::error::Tag '$TAG' must be vX.Y.Z (stable) or vX.Y.Z-suffix (prerelease)"
            exit 1
          fi
          STABLE=true
          DEV=false
          case "$TAG" in
            *-dev|*-dev.*) STABLE=false; DEV=true ;;
            *-*) STABLE=false ;;
          esac
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" && "$DEV" != "true" ]]; then
            echo "::error::Manual runs only build dev images, push a tag for releases"
            exit 1
          fi
          echo "version=$TAG" >> "$GITHUB_OUTPUT"
          echo "stable=$STABLE" >> "$GITHUB_OUTPUT"
          echo "dev=$DEV" >> "$GITHUB_OUTPUT"

  test:
    name: Test
    needs: classify
    uses: ./.github/workflows/ci.yml

  generate-proto:
    name: Generate Proto Code
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Generate proto code
        run: make gen

      - name: Upload generated Go proto code
        uses: actions/upload-artifact@v4
        with:
          name: proto-go
          path: pkg/proto
          retention-days: 1

      - name: Upload generated db store code
        uses: actions/upload-artifact@v4
        with:
          name: store-gen
          path: |
            internal/db/store.gen.go
            internal/db/schema.sql
          retention-days: 1

      - name: Upload generated TypeScript proto code
        uses: actions/upload-artifact@v4
        with:
          name: proto-ts
          path: web/discopanel/src/lib/proto
          retention-days: 1
  
      - name: Upload generated oapi schema
        uses: actions/upload-artifact@v4
        with:
          name: api-schema-yaml
          path: web/discopanel/static/schemav1.yaml
          retention-days: 1

  build-frontend:
    name: Build Frontend
    needs: [classify, generate-proto]
    if: ${{ needs.classify.outputs.dev == 'false' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Download generated TypeScript proto code
        uses: actions/download-artifact@v4
        with:
          name: proto-ts
          path: web/discopanel/src/lib/proto

      - name: Download generated oapi schema
        uses: actions/download-artifact@v4
        with:
          name: api-schema-yaml
          path: web/discopanel/static

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/discopanel/package-lock.json

      - name: Install frontend dependencies
        run: |
          cd web/discopanel
          npm ci

      - name: Build frontend
        run: |
          cd web/discopanel
          APP_VERSION=${{ needs.classify.outputs.version }} npm run build

      - name: Upload frontend build
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: web/discopanel/build
          retention-days: 1

  build-binaries:
    name: Build Binaries
    needs: [classify, generate-proto, build-frontend]
    if: ${{ needs.classify.outputs.dev == 'false' }}
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            suffix: linux-amd64
            runner: ubuntu-latest
          - goos: linux
            goarch: arm64
            suffix: linux-arm64
            runner: ubuntu-latest
            cc: aarch64-linux-gnu-gcc
          - goos: darwin
            goarch: amd64
            suffix: darwin-amd64
            runner: macOS-15
          - goos: darwin
            goarch: arm64
            suffix: darwin-arm64
            runner: macos-latest
          - goos: windows
            goarch: amd64
            suffix: windows-amd64.exe
            runner: ubuntu-latest
            cc: x86_64-w64-mingw32-gcc
            cxx: x86_64-w64-mingw32-g++

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Download generated Go proto code
        uses: actions/download-artifact@v4
        with:
          name: proto-go
          path: pkg/proto

      - name: Download generated db store code
        uses: actions/download-artifact@v4
        with:
          name: store-gen
          path: internal/db

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install cross-compiler (Linux ARM64)
        if: matrix.goos == 'linux' && matrix.goarch == 'arm64'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Install cross-compiler (Windows)
        if: matrix.goos == 'windows'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64-x86-64 g++-mingw-w64-x86-64

      - name: Download frontend build
        uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: web/discopanel/build

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          # Sqlite driver dies without cgo on cross builds
          CGO_ENABLED: 1
          CC: ${{ matrix.cc || '' }}
          CXX: ${{ matrix.cxx || '' }}
        run: |
          go build -ldflags "-X github.com/discohaus/discopanel/pkg/config.Version=${{ needs.classify.outputs.version }}" -o discopanel-${{ matrix.suffix }} ./cmd/discopanel

      - name: Compress binary (non-Windows)
        if: matrix.goos != 'windows'
        run: |
          tar -czf discopanel-${{ matrix.suffix }}.tar.gz discopanel-${{ matrix.suffix }}

      - name: Compress binary (Windows)
        if: matrix.goos == 'windows'
        run: |
          zip discopanel-${{ matrix.suffix }}.zip discopanel-${{ matrix.suffix }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.suffix }}
          path: |
            discopanel-${{ matrix.suffix }}.tar.gz
            discopanel-${{ matrix.suffix }}.zip
          if-no-files-found: error
          retention-days: 1

  build-docker:
    name: Build and Push Docker Images
    needs: [classify, test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (prod)
        id: meta
        if: ${{ needs.classify.outputs.dev == 'false' }}
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/discohaus/discopanel
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ needs.classify.outputs.stable == 'true' }}

      - name: Extract metadata (dev)
        id: meta-dev
        if: ${{ needs.classify.outputs.dev == 'true' }}
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/discohaus/discopanel
          tags: |
            type=raw,value=${{ needs.classify.outputs.version }}
            type=raw,value=dev
          flavor: |
            latest=false

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.discopanel
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags || steps.meta-dev.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels || steps.meta-dev.outputs.labels }}
          no-cache: true
          build-args: |
            APP_VERSION=${{ needs.classify.outputs.version }}

  create-release:
    name: Create GitHub Release
    needs: [classify, build-binaries, build-docker]
    if: ${{ needs.classify.outputs.dev == 'false' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: binary-*
          path: ./artifacts

      - name: Generate changelog
        id: changelog
        env:
          VERSION: ${{ needs.classify.outputs.version }}
          STABLE: ${{ needs.classify.outputs.stable }}
        run: |
          # Stable notes reach back past betas to last stable
          EXCLUDE=()
          [ "$STABLE" = "true" ] && EXCLUDE=(--exclude 'v*-*')

          # Get the previous app tag, other tag families stay out
          PREV_TAG=$(git describe --tags --abbrev=0 --match 'v[0-9]*' "${EXCLUDE[@]}" "${VERSION}^" 2>/dev/null || echo "")
          
          if [ -z "$PREV_TAG" ]; then
            echo "No previous tag found"
            CHANGELOG="Initial release"
          else
            echo "Generating changelog from ${PREV_TAG} to ${VERSION}"
            CHANGELOG=$(git log --pretty=format:"- %s (%h)" ${PREV_TAG}..${VERSION})
          fi
          
          # Save to file for release body
          cat << EOF > RELEASE_NOTES.md
          ## What's Changed
          
          ${CHANGELOG}
          EOF

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.classify.outputs.version }}
          name: DiscoPanel ${{ needs.classify.outputs.version }}
          body_path: RELEASE_NOTES.md
          draft: false
          prerelease: ${{ needs.classify.outputs.stable == 'false' }}
          files: |
            ./artifacts/**/*.tar.gz
            ./artifacts/**/*.zip

  notify-discord:
    name: Discord Notification
    needs: [classify, create-release]
    runs-on: ubuntu-latest
    if: ${{ needs.create-release.result == 'success' }}
    
    steps:
      - name: Send Discord notification
        if: success()
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
          VERSION: ${{ needs.classify.outputs.version }}
          STABLE: ${{ needs.classify.outputs.stable }}
        run: |
          RELEASE_URL="https://github.com/${{ github.repository }}/releases/tag/${VERSION}"
          if [ "$STABLE" = "true" ]; then
            TITLE="DiscoPanel ${VERSION} Released!"
            DESC="A new version of DiscoPanel has been released."
          else
            TITLE="DiscoPanel ${VERSION} Pre-release!"
            DESC="A new pre-release of DiscoPanel is available for testing. Stable installs and Proxmox updates are not affected."
          fi
          
          curl -H "Content-Type: application/json" \
            -d '{
              "embeds": [{
                "title": "'"${TITLE}"'",
                "description": "'"${DESC}"'",
                "url": "'"${RELEASE_URL}"'",
                "color": 5814783,
                "image": {
                  "url": "https://cdn.jsdelivr.net/gh/discohaus/identity@1.0.0/assets/discopanel/lockup.svg"
                },
                "fields": [
                  {
                    "name": "Version",
                    "value": "`'"${VERSION}"'`",
                    "inline": true
                  },
                  {
                    "name": "Release Page",
                    "value": "[View Release]('"${RELEASE_URL}"')",
                    "inline": true
                  },
                  {
                    "name": "Container Images",
                    "value": "[View Images](https://github.com/discohaus/discopanel/pkgs/container/discopanel)",
                    "inline": true
                  }
                ],
                "footer": {
                  "text": "DiscoPanel Release"
                },
                "timestamp": "'"$(date -u +%Y-%m-%dT%H:%M:%S.000Z)"'"
              }]
            }' \
            $DISCORD_WEBHOOK