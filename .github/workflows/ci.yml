name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Vet and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Generate proto code
        run: make gen

      - name: Validate migrations
        run: make migrate-validate

      # Fails when a proto change has no migration file yet
      - name: Check migrations cover the models
        run: |
          make migrate-diff NAME=ci_check
          if [ -n "$(git status --porcelain internal/db/migrations)" ]; then
            git status --porcelain internal/db/migrations
            echo "migrations out of sync with models, run make migrate-diff NAME=<name>"
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/discopanel/package-lock.json

      - name: Install frontend dependencies
        run: |
          cd web/discopanel
          npm ci

      # Go embeds web/discopanel/build, so vet and test need it first
      - name: Build frontend
        run: |
          cd web/discopanel
          npm run build

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Frontend check
        run: |
          cd web/discopanel
          npm run check
