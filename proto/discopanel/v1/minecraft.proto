syntax = "proto3";

package discopanel.v1;

import "discopanel/options/v1/options.proto";
import "discopanel/v1/storage.proto";

option go_package = "github.com/discohaus/discopanel/pkg/proto/discopanel/v1;discopanelv1";

// Minecraft version and runtime information
service MinecraftService {
  // List all Minecraft versions
  rpc GetMinecraftVersions(GetMinecraftVersionsRequest) returns (GetMinecraftVersionsResponse) {
    option (discopanel.options.v1.perm) = {session: true};
  }
  // List supported mod loaders
  rpc GetModLoaders(GetModLoadersRequest) returns (GetModLoadersResponse) {
    option (discopanel.options.v1.perm) = {session: true};
  }
  // List available Docker images
  rpc GetDockerImages(GetDockerImagesRequest) returns (GetDockerImagesResponse) {
    option (discopanel.options.v1.perm) = {session: true};
  }
  // List installable builds of a loader for one MC version
  rpc GetLoaderVersions(GetLoaderVersionsRequest) returns (GetLoaderVersionsResponse) {
    option (discopanel.options.v1.perm) = {session: true};
  }
}

// Minecraft version metadata
message MinecraftVersion {
  string id = 1;
  string type = 2; // Release, snapshot, old_beta, or old_alpha
  string release_time = 3;
  string url = 4;
}

// Empty versions request
message GetMinecraftVersionsRequest {}

// All available versions
message GetMinecraftVersionsResponse {
  repeated MinecraftVersion versions = 1;
  string latest = 2;
}

// Mod loader capabilities
message ModLoaderInfo {
  string name = 1;
  string display_name = 2;
  string description = 3;
  bool supports_mods = 4;
  bool supports_plugins = 5;
  discopanel.options.v1.ModLoaderCategory category = 6;
  // True when the provisioner installs this loader itself
  bool provisionable = 7;
  ModLoader loader = 8;
  // Directory jars install into, mods or plugins, empty when none
  string mods_directory = 9;
  // True when an exact loader build can be pinned
  bool pinnable_builds = 10;
}

// Empty loaders request
message GetModLoadersRequest {}

// Available mod loaders
message GetModLoadersResponse {
  repeated ModLoaderInfo modloaders = 1;
}

// Container image option
message DockerImage {
  string tag = 1;
  string display_name = 2;
  string description = 3;
  bool recommended = 4;
}

// Empty images request
message GetDockerImagesRequest {}

// Docker image catalog
message GetDockerImagesResponse {
  repeated DockerImage images = 1;
}

// One installable loader build
message LoaderBuild {
  string version = 1;
  bool stable = 2; // False for betas and prereleases
  bool recommended = 3; // Build installed when none is pinned
}

// Loader and MC version to list builds for
message GetLoaderVersionsRequest {
  ModLoader mod_loader = 1;
  string mc_version = 2;
}

// Builds newest first
message GetLoaderVersionsResponse {
  repeated LoaderBuild builds = 1;
}
