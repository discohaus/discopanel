syntax = "proto3";

package discopanel.v1;

import "discopanel/options/v1/options.proto";
import "discopanel/v1/storage.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/discohaus/discopanel/pkg/proto/discopanel/v1;discopanelv1";

// Server mod management
service ModService {
  // List server mods
  rpc ListMods(ListModsRequest) returns (ListModsResponse) {
    option (discopanel.options.v1.perm) = {
      resource: RESOURCE_TYPE_MODS
      action: ACTION_TYPE_READ
      object_id_field: "server_id"
    };
  }
  // Get mod details
  rpc GetMod(GetModRequest) returns (GetModResponse) {
    option (discopanel.options.v1.perm) = {
      resource: RESOURCE_TYPE_MODS
      action: ACTION_TYPE_READ
      object_id_field: "server_id"
    };
  }
  // Import mod from chunked upload session
  rpc ImportUploadedMod(ImportUploadedModRequest) returns (ImportUploadedModResponse) {
    option (discopanel.options.v1.perm) = {
      resource: RESOURCE_TYPE_MODS
      action: ACTION_TYPE_CREATE
      object_id_field: "server_id"
    };
  }
  // Install a mod sourced by id through the indexers
  rpc InstallMod(InstallModRequest) returns (InstallModResponse) {
    option (discopanel.options.v1.perm) = {
      resource: RESOURCE_TYPE_MODS
      action: ACTION_TYPE_CREATE
      object_id_field: "server_id"
    };
  }
  // Update mod metadata
  rpc UpdateMod(UpdateModRequest) returns (UpdateModResponse) {
    option (discopanel.options.v1.perm) = {
      resource: RESOURCE_TYPE_MODS
      action: ACTION_TYPE_UPDATE
      object_id_field: "server_id"
    };
  }
  // Delete mod file
  rpc DeleteMod(DeleteModRequest) returns (DeleteModResponse) {
    option (discopanel.options.v1.perm) = {
      resource: RESOURCE_TYPE_MODS
      action: ACTION_TYPE_DELETE
      object_id_field: "server_id"
    };
  }
  // List world datapacks
  rpc ListDatapacks(ListDatapacksRequest) returns (ListDatapacksResponse) {
    option (discopanel.options.v1.perm) = {
      resource: RESOURCE_TYPE_MODS
      action: ACTION_TYPE_READ
      object_id_field: "server_id"
    };
  }
  // Import datapack zip from chunked upload session
  rpc ImportUploadedDatapack(ImportUploadedDatapackRequest) returns (ImportUploadedDatapackResponse) {
    option (discopanel.options.v1.perm) = {
      resource: RESOURCE_TYPE_MODS
      action: ACTION_TYPE_CREATE
      object_id_field: "server_id"
    };
  }
  // Enable or disable a datapack
  rpc ToggleDatapack(ToggleDatapackRequest) returns (ToggleDatapackResponse) {
    option (discopanel.options.v1.perm) = {
      resource: RESOURCE_TYPE_MODS
      action: ACTION_TYPE_UPDATE
      object_id_field: "server_id"
    };
  }
  // Delete a datapack zip or folder
  rpc DeleteDatapack(DeleteDatapackRequest) returns (DeleteDatapackResponse) {
    option (discopanel.options.v1.perm) = {
      resource: RESOURCE_TYPE_MODS
      action: ACTION_TYPE_DELETE
      object_id_field: "server_id"
    };
  }
}

// Server mods request
message ListModsRequest {
  string server_id = 1;
}

// All server mods
message ListModsResponse {
  repeated Mod mods = 1;
}

// Mod lookup
message GetModRequest {
  string server_id = 1;
  string mod_id = 2;
}

// Mod details
message GetModResponse {
  Mod mod = 1;
}

// Import mod from chunked upload session
message ImportUploadedModRequest {
  reserved 3, 4;
  reserved "display_name", "description";
  string server_id = 1;
  string upload_session_id = 2;
}

// Import result
message ImportUploadedModResponse {
  Mod mod = 1;
  string message = 2;
  // Enabled jars the upload replaced for the same mod id
  repeated string superseded = 3;
}

// Mod to source by its declared id
message InstallModRequest {
  string server_id = 1;
  string mod_id = 2;
  // Loader syntax version range the jar must satisfy
  string version_range = 3;
  // Metadata dialect the range is written in
  string dialect = 4;
}

// Installed mod and the jars it replaced
message InstallModResponse {
  Mod mod = 1;
  repeated string superseded = 2;
}

// Mod fields to update
message UpdateModRequest {
  reserved 3, 4;
  reserved "display_name", "description";
  string server_id = 1;
  string mod_id = 2;
  optional bool enabled = 5;
}

// Updated mod
message UpdateModResponse {
  Mod mod = 1;
}

// Mod to delete
message DeleteModRequest {
  string server_id = 1;
  string mod_id = 2;
}

// Deletion confirmation
message DeleteModResponse {
  string message = 1;
}

// One datapack in the world datapacks dir
message Datapack {
  // File or folder name, unique per server
  string name = 1;
  // Folder pack rather than a zip
  bool is_directory = 2;
  bool enabled = 3;
  // Bytes on disk, summed for folders
  int64 size = 4;
  google.protobuf.Timestamp modified_at = 5;
  // Plain text from pack.mcmeta
  string description = 6;
  // Zero when pack.mcmeta does not say
  int32 pack_format = 7;
}

// Server datapacks request
message ListDatapacksRequest {
  string server_id = 1;
}

// All datapacks in the world
message ListDatapacksResponse {
  repeated Datapack datapacks = 1;
  // Datapacks dir relative to the server data dir
  string directory = 2;
  // False until the server first generates the world, packs placed before
  // then are applied when it does
  bool world_exists = 3;
}

// Import datapack from chunked upload session
message ImportUploadedDatapackRequest {
  string server_id = 1;
  string upload_session_id = 2;
}

// Import result
message ImportUploadedDatapackResponse {
  Datapack datapack = 1;
  // An existing zip of the same name was replaced
  bool replaced = 2;
  // False when the world has not been generated yet
  bool world_exists = 3;
}

// Datapack to enable or disable
message ToggleDatapackRequest {
  string server_id = 1;
  string name = 2;
  bool enabled = 3;
}

// Datapack after the move
message ToggleDatapackResponse {
  Datapack datapack = 1;
}

// Datapack to delete
message DeleteDatapackRequest {
  string server_id = 1;
  string name = 2;
}

// Deletion confirmation
message DeleteDatapackResponse {}
