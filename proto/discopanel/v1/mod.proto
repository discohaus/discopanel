syntax = "proto3";

package discopanel.v1;

import "discopanel/options/v1/options.proto";
import "discopanel/v1/storage.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/discohaus/discopanel/pkg/proto/discopanel/v1;discopanelv1";

// Server mod management
service ModService {
  // List server mods
  rpc ListMods(ListModsRequest) returns (ListModsResponse) {
    option (discopanel.options.v1.perm) = {
      resource: RESOURCE_TYPE_MODS
      action: ACTION_TYPE_READ
      object_id_field: "server_id"
    };
  }
  // Get mod details
  rpc GetMod(GetModRequest) returns (GetModResponse) {
    option (discopanel.options.v1.perm) = {
      resource: RESOURCE_TYPE_MODS
      action: ACTION_TYPE_READ
      object_id_field: "server_id"
    };
  }
  // Import mod from chunked upload session
  rpc ImportUploadedMod(ImportUploadedModRequest) returns (ImportUploadedModResponse) {
    option (discopanel.options.v1.perm) = {
      resource: RESOURCE_TYPE_MODS
      action: ACTION_TYPE_CREATE
      object_id_field: "server_id"
    };
  }
  // Install a mod sourced by id through the indexers
  rpc InstallMod(InstallModRequest) returns (InstallModResponse) {
    option (discopanel.options.v1.perm) = {
      resource: RESOURCE_TYPE_MODS
      action: ACTION_TYPE_CREATE
      object_id_field: "server_id"
    };
  }
  // Update mod metadata
  rpc UpdateMod(UpdateModRequest) returns (UpdateModResponse) {
    option (discopanel.options.v1.perm) = {
      resource: RESOURCE_TYPE_MODS
      action: ACTION_TYPE_UPDATE
      object_id_field: "server_id"
    };
  }
  // Delete mod file
  rpc DeleteMod(DeleteModRequest) returns (DeleteModResponse) {
    option (discopanel.options.v1.perm) = {
      resource: RESOURCE_TYPE_MODS
      action: ACTION_TYPE_DELETE
      object_id_field: "server_id"
    };
  }
  // Check installed jars for newer compatible builds
  rpc CheckModUpdates(CheckModUpdatesRequest) returns (CheckModUpdatesResponse) {
    option (discopanel.options.v1.perm) = {
      resource: RESOURCE_TYPE_MODS
      action: ACTION_TYPE_READ
      object_id_field: "server_id"
    };
  }
  // Replace jars with their newest compatible builds
  rpc ApplyModUpdates(ApplyModUpdatesRequest) returns (ApplyModUpdatesResponse) {
    option (discopanel.options.v1.perm) = {
      resource: RESOURCE_TYPE_MODS
      action: ACTION_TYPE_UPDATE
      object_id_field: "server_id"
    };
  }
  // Restore the jar an update replaced
  rpc RollbackModUpdate(RollbackModUpdateRequest) returns (RollbackModUpdateResponse) {
    option (discopanel.options.v1.perm) = {
      resource: RESOURCE_TYPE_MODS
      action: ACTION_TYPE_UPDATE
      object_id_field: "server_id"
    };
  }
}

// Server mods request
message ListModsRequest {
  string server_id = 1;
}

// All server mods
message ListModsResponse {
  repeated Mod mods = 1;
}

// Mod lookup
message GetModRequest {
  string server_id = 1;
  string mod_id = 2;
}

// Mod details
message GetModResponse {
  Mod mod = 1;
}

// Import mod from chunked upload session
message ImportUploadedModRequest {
  reserved 3, 4;
  reserved "display_name", "description";
  string server_id = 1;
  string upload_session_id = 2;
}

// Import result
message ImportUploadedModResponse {
  Mod mod = 1;
  string message = 2;
  // Enabled jars the upload replaced for the same mod id
  repeated string superseded = 3;
}

// Mod to source by its declared id
message InstallModRequest {
  string server_id = 1;
  string mod_id = 2;
  // Loader syntax version range the jar must satisfy
  string version_range = 3;
  // Metadata dialect the range is written in
  string dialect = 4;
}

// Installed mod and the jars it replaced
message InstallModResponse {
  Mod mod = 1;
  repeated string superseded = 2;
}

// Mod fields to update
message UpdateModRequest {
  reserved 3, 4;
  reserved "display_name", "description";
  string server_id = 1;
  string mod_id = 2;
  optional bool enabled = 5;
}

// Updated mod
message UpdateModResponse {
  Mod mod = 1;
}

// Mod to delete
message DeleteModRequest {
  string server_id = 1;
  string mod_id = 2;
}

// Deletion confirmation
message DeleteModResponse {
  string message = 1;
}

// Upstream that identified a jar
enum ModUpdateSource {
  MOD_UPDATE_SOURCE_UNSPECIFIED = 0;
  MOD_UPDATE_SOURCE_MODRINTH = 1;
  MOD_UPDATE_SOURCE_CURSEFORGE = 2;
}

// Update verdict for one jar
enum ModUpdateStatus {
  MOD_UPDATE_STATUS_UNSPECIFIED = 0;
  // No upstream knows the file by its hash
  MOD_UPDATE_STATUS_UNKNOWN_SOURCE = 1;
  MOD_UPDATE_STATUS_UP_TO_DATE = 2;
  MOD_UPDATE_STATUS_UPDATE_AVAILABLE = 3;
  // Known, but nothing matches this server's version, loader and channel
  MOD_UPDATE_STATUS_NO_COMPATIBLE_VERSION = 4;
  MOD_UPDATE_STATUS_ERROR = 5;
}

// One build of an upstream project
message ModRelease {
  string version_id = 1;
  string version = 2;
  string file_name = 3;
  ReleaseType release_type = 4;
  google.protobuf.Timestamp published_at = 5;
  string changelog_url = 6;
}

// Update state of one installed jar
message ModUpdate {
  // Mod entry id as ListMods reports it
  string mod_id = 1;
  string file_name = 2;
  bool enabled = 3;
  ModUpdateStatus status = 4;
  ModUpdateSource source = 5;
  string project_id = 6;
  string project_name = 7;
  string project_url = 8;
  ModRelease current = 9;
  ModRelease latest = 10;
  string error = 11;
  // File the last update replaced, set while a rollback is possible
  string rollback_file_name = 12;
  string rollback_version = 13;
  // Set when a pack or setting reinstalls this jar, no update is offered
  string managed_by = 14;
}

// Jars to check
message CheckModUpdatesRequest {
  string server_id = 1;
  // Offer beta builds as well as releases
  bool include_beta = 2;
}

// Verdict per jar and the target it was graded against
message CheckModUpdatesResponse {
  repeated ModUpdate updates = 1;
  string mc_version = 2;
  repeated string loaders = 3;
  // Server runs a modpack, pack installs may replace updated jars
  bool modpack = 4;
}

// Jars to update, each is rechecked on the server
message ApplyModUpdatesRequest {
  string server_id = 1;
  repeated string mod_ids = 2;
  bool include_beta = 3;
}

// Outcome for one requested jar
message ModUpdateOutcome {
  string mod_id = 1;
  string file_name = 2;
  bool updated = 3;
  string new_file_name = 4;
  string new_version = 5;
  string error = 6;
}

// Per jar outcomes
message ApplyModUpdatesResponse {
  repeated ModUpdateOutcome outcomes = 1;
  // Server is running, the new jars load on its next start
  bool restart_required = 2;
}

// Jar whose last update to undo
message RollbackModUpdateRequest {
  string server_id = 1;
  string mod_id = 2;
}

// Restored jar
message RollbackModUpdateResponse {
  string file_name = 1;
  bool restart_required = 2;
}
